name: CI

on:
  # The Swift edition ships from `main`. The frozen Tauri edition is preserved on `tauri-legacy`.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  linux:
    name: Linux Build, Test, and Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-swift v3 verifies Swiftly before importing Swift's current signing key.
      # Import the official key bundle first and keep signature verification enabled.
      - name: Import Swift signing keys
        run: curl --fail --location --silent --show-error https://swift.org/keys/all-keys.asc | gzip --decompress | gpg --import

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.1"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            flatpak-builder \
            libadwaita-1-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            pkg-config \
            python3-yaml \
            xdotool \
            xvfb

      - name: Validate Linux packaging
        run: ./scripts/validate-flatpak.sh

      - name: Use Linux dependency lockfile
        run: cp linux/Package.resolved Package.resolved

      - name: Run Linux tests
        run: swift test --disable-automatic-resolution --disable-prefetching

      - name: Build Linux release
        run: swift build -c release --disable-automatic-resolution --disable-prefetching

      - name: Verify Linux runtime performance
        run: ./scripts/verify-linux-performance.sh
